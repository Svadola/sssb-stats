name: Deadline watch

# Leta varje timme efter deadlines inom 150 minuter, oavsett klockslag/DST.
# Actions kan starta sent; flera starttillfällen ger fler chanser att hinna fram.
# Skriptet avslutar direkt om inga deadlines är nära.
on:
  schedule:
    - cron: "43 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  queue: max   # ett väntande watch-jobb får inte ersättas av nästa poll

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 230
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}   # senaste datan när ett köat jobb faktiskt startar
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m scraper.watch
      - name: Commit & push
        run: |
          git config user.name "sssb-scraper[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "Inga ändringar."
            exit 0
          fi
          git commit -m "deadline watch $(date -u +'%Y-%m-%d %H:%MZ')"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
